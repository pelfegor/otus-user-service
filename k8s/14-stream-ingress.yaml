apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stream-processing-ingress
  namespace: m
spec:
  ingressClassName: nginx
  rules:
    - host: arch.homework
      http:
        paths:
          - path: /billing
            pathType: Prefix
            backend:
              service:
                name: billing-service
                port: {number: 8001}
          - path: /orders
            pathType: Prefix
            backend:
              service:
                name: order-service
                port: {number: 8002}
          - path: /notifications
            pathType: Prefix
            backend:
              service:
                name: notification-service
                port: {number: 8003}
