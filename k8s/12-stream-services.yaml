
apiVersion: v1
kind: ConfigMap
metadata:
  name: billing-service-config
  namespace: m
data:
  SERVER_PORT: "8001"
  DB_URL: jdbc:postgresql://user-service-postgresql:5432/billing
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: order-service-config
  namespace: m
data:
  SERVER_PORT: "8002"
  DB_URL: jdbc:postgresql://user-service-postgresql:5432/orders
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: notification-service-config
  namespace: m
data:
  SERVER_PORT: "8003"
  DB_URL: jdbc:postgresql://user-service-postgresql:5432/notifications
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-service
  namespace: m
spec:
  replicas: 1
  selector:
    matchLabels:
      app: billing-service
  template:
    metadata:
      labels:
        app: billing-service
    spec:
      containers:
        - name: billing-service
          image: billing-service:stream-processing
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8001
          envFrom:
            - configMapRef:
                name: billing-service-config
          env:
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: user-service-db-secret
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: user-service-db-secret
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: user-service-jwt-secret
                  key: JWT_SECRET
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 40
            periodSeconds: 20
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: billing-service
  namespace: m
spec:
  selector:
    app: billing-service
  ports:
    - name: http
      port: 8001
      targetPort: http
---
