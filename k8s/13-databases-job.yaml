apiVersion: batch/v1
kind: Job
metadata:
  name: stream-processing-databases
  namespace: m
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: create-databases
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - |
              set -eu
              until pg_isready -h "$DB_HOST" -p 5432 -U postgres; do sleep 2; done
              for db in billing orders notifications; do
                exists=$(PGPASSWORD="$POSTGRES_PASSWORD" psql -h "$DB_HOST" -U postgres -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='$db'")
                if [ "$exists" != "1" ]; then
                  PGPASSWORD="$POSTGRES_PASSWORD" createdb -h "$DB_HOST" -U postgres -O "$DB_USERNAME" "$db"
                fi
              done
          env:
            - name: DB_HOST
              value: user-service-postgresql
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef: {name: user-service-db-secret, key: DB_USERNAME}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: user-service-db-secret, key: postgres-password}
