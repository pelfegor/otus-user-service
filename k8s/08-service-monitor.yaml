apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: user-service
  namespace: monitoring
  labels:
    release: monitoring

spec:
  namespaceSelector:
    matchNames:
      - default

  selector:
    matchLabels:
      app: user-service

  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 15s