openapi: 3.1.0
info:
  title: OTUS Stream Processing API
  version: 1.0.0
  description: Public HTTP APIs for User, Billing, Order, and Notification services.
servers:
  - url: http://arch.homework
security:
  - bearerJwt: []
paths:
  /auth/register:
    post:
      security: []
      summary: Register a user and enqueue UserRegistered
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterRequest'}
      responses:
        '201':
          description: User created; billing account will be created asynchronously.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '400': {description: Invalid registration data}
  /auth/login:
    post:
      security: []
      summary: Authenticate and receive a JWT
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200':
          description: JWT access token
          content:
            application/json:
              schema:
                type: object
                required: [accessToken]
                properties:
                  accessToken: {type: string}
        '401': {description: Invalid credentials}
  /profile:
    get:
      summary: Read the authenticated user's profile
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '401': {description: Missing or invalid JWT}
    put:
      summary: Update the authenticated user's profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [firstName, lastName, email]
              properties:
                firstName: {type: string, maxLength: 100}
                lastName: {type: string, maxLength: 100}
                email: {type: string, format: email, maxLength: 255}
                phone: {type: string, maxLength: 50}
      responses:
        '200': {description: Updated user profile}
        '400': {description: Invalid profile data}
        '401': {description: Missing or invalid JWT}
  /users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: integer, format: int64, minimum: 1}
    get:
      summary: Read a user record owned by the authenticated user
      responses:
        '200': {description: User record}
        '401': {description: Missing or invalid JWT}
        '403': {description: User is not the owner}
        '404': {description: User not found}
    put:
      summary: Update a user record owned by the authenticated user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, firstName, lastName, email]
              properties:
                username: {type: string, maxLength: 100}
                firstName: {type: string, maxLength: 100}
                lastName: {type: string, maxLength: 100}
                email: {type: string, format: email, maxLength: 255}
                phone: {type: string, maxLength: 50}
      responses:
        '200': {description: Updated user}
        '400': {description: Invalid user data}
        '401': {description: Missing or invalid JWT}
        '403': {description: User is not the owner}
    delete:
      summary: Delete a user record owned by the authenticated user
      responses:
        '204': {description: Deleted}
        '401': {description: Missing or invalid JWT}
        '403': {description: User is not the owner}
        '404': {description: User not found}
  /billing/accounts/me:
    get:
      summary: Read the authenticated user's billing balance
      responses:
        '200':
          description: Current account balance
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Account'}
        '401': {description: Missing or invalid JWT}
        '404': {description: Billing account has not been created yet}
  /billing/accounts/me/deposit:
    post:
      summary: Deposit money to the authenticated user's account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount: {type: number, exclusiveMinimum: 0, maximum: 99999999999999999.99, multipleOf: 0.01}
      responses:
        '200':
          description: Updated account balance
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Account'}
        '400': {description: Amount must be positive with at most two decimal places}
        '401': {description: Missing or invalid JWT}
        '404': {description: Billing account has not been created yet}
  /orders:
    post:
      summary: Create an order for the authenticated user
      description: Returns immediately with PENDING status. Payment is completed asynchronously.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [price]
              properties:
                price: {type: number, exclusiveMinimum: 0, maximum: 99999999999999999.99, multipleOf: 0.01}
      responses:
        '202':
          description: Order accepted for asynchronous payment
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Order'}
        '400': {description: Invalid order price or legacy JWT without email claim}
        '401': {description: Missing or invalid JWT}
  /orders/{id}:
    get:
      summary: Read an order owned by the authenticated user
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer, format: int64, minimum: 1}
      responses:
        '200':
          description: Order with its current payment status
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Order'}
        '401': {description: Missing or invalid JWT}
        '403': {description: Order belongs to another user}
        '404': {description: Order not found}
  /notifications:
    get:
      summary: List notifications belonging to the authenticated user
      responses:
        '200':
          description: Notifications ordered newest first
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Notification'}
        '401': {description: Missing or invalid JWT}
components:
  securitySchemes:
    bearerJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    RegisterRequest:
      type: object
      required: [username, password, firstName, lastName, email]
      properties:
        username: {type: string, maxLength: 100}
        password: {type: string, minLength: 6, maxLength: 100, writeOnly: true}
        firstName: {type: string, maxLength: 100}
        lastName: {type: string, maxLength: 100}
        email: {type: string, format: email, maxLength: 255}
        phone: {type: string, maxLength: 50}
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: {type: string}
        password: {type: string, writeOnly: true}
    User:
      type: object
      properties:
        id: {type: integer, format: int64}
        username: {type: string}
        firstName: {type: string}
        lastName: {type: string}
        email: {type: string, format: email}
        phone: {type: string}
    Account:
      type: object
      required: [userId, balance]
      properties:
        userId: {type: integer, format: int64}
        balance: {type: number, multipleOf: 0.01}
    Order:
      type: object
      required: [id, price, status]
      properties:
        id: {type: integer, format: int64}
        price: {type: number, multipleOf: 0.01}
        status: {type: string, enum: [PENDING, PAID, PAYMENT_FAILED]}
    Notification:
      type: object
      required: [orderId, recipient, amount, subject, message]
      properties:
        orderId: {type: integer, format: int64}
        recipient: {type: string, format: email}
        amount: {type: number, multipleOf: 0.01}
        subject: {type: string}
        message: {type: string}
